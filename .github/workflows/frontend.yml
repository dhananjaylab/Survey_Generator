name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend-vite/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend-vite/**"

defaults:
  run:
    working-directory: frontend-vite

jobs:
  ci:
    name: Type-check, Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit / property tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_WS_BASE_URL:  wss://api.example.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend-vite/dist
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # ── Replace this step with your actual deploy mechanism ────────────────
      # Examples: Cloudflare Pages, Vercel CLI, AWS S3 + CloudFront, etc.
      - name: Deploy (placeholder)
        run: echo "Deploy step — configure for your hosting provider"
